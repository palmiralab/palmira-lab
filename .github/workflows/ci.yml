name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый запуск на ту же ветку отменяет предыдущий, чтобы не копить очередь.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Нужна только CLI Prisma для generate (prisma.config.ts читает переменную);
      # к базе на этом шаге никто не подключается.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  web:
    name: Сайт (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Сборка заодно проверяет типы и что все страницы собираются без .env.
      - run: npm run build
