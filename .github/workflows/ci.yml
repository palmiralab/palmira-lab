name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Ручной запуск из вкладки Actions (кнопка Run workflow, когда файл есть в main).
  workflow_dispatch:

# Новый запуск на ту же ветку отменяет предыдущий, чтобы не копить очередь.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Нужна только CLI Prisma для generate (prisma.config.ts читает переменную);
      # к базе на этом шаге никто не подключается.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  web:
    name: Сайт (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Сборка заодно проверяет типы и что все страницы собираются без .env.
      - run: npm run build

  api-e2e:
    name: API e2e (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Без проверки готовности тесты могли бы стартовать раньше базы.
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      # Применяем боевые миграции к пустой базе: заодно проверяем, что они проходят с нуля.
      - run: npm run db:deploy
      - run: npm run test:e2e
