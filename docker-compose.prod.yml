# Боевой compose для сервера (шаги 4.4–4.6 деплоя). Лежит на сервере в
# /home/deploy/palmira/ рядом с .env (POSTGRES_*), api.env и web.env; секреты
# в репозиторий не попадают. Отличие от локального docker-compose.yml: порт
# postgres наружу не публикуется, API слушает только 127.0.0.1 (наружу его
# выставит nginx), образы собираются на сервере (amd64).
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
name: palmira

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый: применяет миграции и завершается. API стартует только после
  # его успешного завершения, поэтому упавшая миграция не даёт запуститься
  # приложению с неподходящей схемой.
  migrate:
    build:
      context: apps/api
      target: migrate
    image: palmira-api-migrate
    env_file: api.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: apps/api
      target: runtime
    image: palmira-api
    restart: unless-stopped
    env_file: api.env
    ports:
      - "127.0.0.1:3110:3100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Next.js (standalone). Контекст сборки: корень репозитория (нужен certs/),
  # Dockerfile в apps/web. На хост выставлен только 127.0.0.1:3010, наружу
  # его отдаст nginx. API_URL внутри сети: http://api:3100 (см. web.env).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: palmira-web
    restart: unless-stopped
    env_file: web.env
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      api:
        condition: service_healthy

# С сервера Telegram доступен только по IPv6 (IPv4 к api.telegram.org закрыт),
# а в сети Docker по умолчанию IPv6 нет: без этого API не отправляет уведомления
# о заявках (UND_ERR_CONNECT_TIMEOUT). Диапазон внутренний, наружу выходит через хост.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:d0c:1::/64

volumes:
  postgres_data:
